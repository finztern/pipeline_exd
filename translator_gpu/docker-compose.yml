services:
  translator_gpu:
    build: .
    container_name: translator_gpu
    restart: unless-stopped
    environment:
      GPU_TRANSLATOR_PORT: "8004"
      UPIPE_URL:           "${UPIPE_URL}"
      OPUS_MODELS:         "${OPUS_MODELS:-}"
      OPUS_LANGS:          "${OPUS_LANGS:-}"
      OPUS_FALLBACK:       "${OPUS_FALLBACK:-Helsinki-NLP/opus-mt-mul-en}"
      GPU_SAMPLE_PATH:     "${GPU_SAMPLE_PATH:-/models/sample.jsonl}"
      NLLB_ONLY:           "${NLLB_ONLY:-}"
      NLLB_MODEL:          "${NLLB_MODEL:-facebook/nllb-200-distilled-600M}"
      GPU_COMPUTE_TYPE:    "${GPU_COMPUTE_TYPE:-int8}"
      GPU_BATCH_SIZE:      "${GPU_BATCH_SIZE:-16}"
      GPU_MAX_WAIT_SECONDS: "${GPU_MAX_WAIT_SECONDS:-5}"
      GPU_INFLIGHT:        "${GPU_INFLIGHT:-2}"
      GPU_MAX_TOKENS:      "${GPU_MAX_TOKENS:-150}"
      GPU_BEAM_SIZE:       "${GPU_BEAM_SIZE:-1}"
      GPU_QUEUE_SIZE:      "${GPU_QUEUE_SIZE:-2000}"
      HTTP_PROXY:          "${HF_PROXY:-}"
      HTTPS_PROXY:         "${HF_PROXY:-}"
    ports:
      - "8004:8004"
    volumes:
      - ./models_cache:/root/.cache
      - ./ct2_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
